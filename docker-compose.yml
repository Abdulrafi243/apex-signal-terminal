services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    restart: unless-stopped
    expose: ["8000"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on:
      backend:
        condition: service_healthy
